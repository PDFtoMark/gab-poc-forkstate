name: artdl-probe
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p p && printf 'hello\n' > p/f.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr
          path: p/

  down:
    needs: up
    runs-on: ubuntu-latest
    steps:
      - name: gh-script v3.1.0 (target client)
        continue-on-error: true
        uses: actions/github-script@v3.1.0
        with:
          script: |
            var arts = await github.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId});
            var a = arts.data.artifacts.filter(function(x){return x.name=='pr'})[0];
            console.log('FOUND', a && a.id);
            try {
              var d = await github.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id, archive_format: 'zip'});
              console.log('V310_DL status=' + d.status + ' len=' + (d.data && d.data.length) + ' type=' + typeof d.data);
            } catch (e) { console.log('V310_ERR ' + String(e.message).slice(0, 200)); }
      - name: gh-script v7 (modern client)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            var arts = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId});
            var a = arts.data.artifacts.filter(function(x){return x.name=='pr'})[0];
            try {
              var d = await github.rest.actions.downloadArtifact({owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id, archive_format: 'zip'});
              console.log('V7_DL status=' + d.status + ' len=' + (d.data && d.data.byteLength));
            } catch (e) { console.log('V7_ERR ' + String(e.message).slice(0, 200)); }
      - name: download-artifact action
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr
          path: dl
      - run: ls -la dl 2>&1 || true
